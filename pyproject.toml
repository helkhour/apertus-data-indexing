[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apertus-indexing"
version = "0.1.0"
description = "Shared Elasticsearch indexing package for Apertus data sources."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
]

[project.scripts]
apertus-indexing-es-bootstrap = "apertus_indexing.es_bootstrap_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
